version: 2

# Dependency update automation, grouped so routine updates arrive as a few
# reviewable PRs rather than one per dependency. The aqua pins (aqua/aqua.yml)
# are not covered by Dependabot.
updates:
  # Provider Go module.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # Our own libraries are released and consumed together; don't delay them.
      exclude:
        - "github.com/terraprovider/*"
    open-pull-requests-limit: 10
    groups:
      terraprovider:
        patterns:
          - "github.com/terraprovider/*"
      # Batch minor/patch bumps; leave majors as individual PRs for review.
      go-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows (all SHA-pinned).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
