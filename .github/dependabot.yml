version: 2

# Dependency update automation, grouped so routine updates arrive as a few
# reviewable PRs rather than one per dependency. The aqua pins (aqua/aqua.yml
# and the aqua version in .github/actions/setup-aqua) are not covered by
# Dependabot; the Update aqua workflow bumps them.
updates:
  # Provider Go module.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # Our own libraries are released and consumed together; don't delay them.
      exclude:
        - "github.com/terraprovider/*"
    open-pull-requests-limit: 10
    groups:
      terraprovider:
        patterns:
          - "github.com/terraprovider/*"
      # Batch minor/patch bumps; leave majors as individual PRs for review.
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Documentation tooling module (tfplugindocs).
  - package-ecosystem: gomod
    directory: "/tools"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      tools:
        patterns:
          - "*"

  # GitHub Actions used by the workflows and by the composite action in
  # .github/actions (all SHA-pinned). Dependabot only finds .github/workflows
  # on its own, so the action's directory is named directly.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-aqua"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
